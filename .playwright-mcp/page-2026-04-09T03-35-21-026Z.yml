      - generic [ref=e35]:
        - heading "Submission Preparation Checklist" [level=2] [ref=e36]
        - paragraph [ref=e37]: As part of the submission process, authors are required to check off their submission's compliance with all of the following items, and submissions may be returned to authors that do not adhere to these guidelines.
        - list [ref=e38]:
          - listitem [ref=e39]: The submission has not been previously published, nor is it before another journal for consideration.
          - listitem [ref=e40]: The submission file is in Microsoft Word (DOCX), or RTF document file format.
          - listitem [ref=e41]: The bibliography (references) is provided as a separate DOCX or RTF file.
          - listitem [ref=e42]: Where available, URLs for the references are provided.
          - listitem [ref=e43]: The text adheres to the stylistic and bibliographic requirements outlined in the Author Guidelines.
          - listitem [ref=e44]: Images are attached separately, compressed in a single ZIP archive, and are NOT included in the main text.
          - listitem [ref=e45]: A separate file for image captions is provided in DOCX or RTF format.
      - generic [ref=e46]:
        - heading "Author Guidelines" [level=2] [ref=e47]
        - paragraph [ref=e48]: The adaptation of your text to A&C editorial guidelines is an essential requirement for its evaluation and publication. Below you will find all the necessary information.
        - paragraph [ref=e49]:
          - text: Papers (ca. 6000 words, including references, figure captions, Author’s names and contact details) should be submitted using the
          - link "dedicated online system" [ref=e50] [cursor=pointer]:
            - /url: https://submission.archcalc.cnr.it/index.php/aec/about/submissions
          - text: ", after creating an account."
        - paragraph [ref=e51]: An abstract in English (max 200 words) should accompany the text.
        - paragraph [ref=e52]: Papers can be submitted in French, English, German, Italian or Spanish (RTF or DOC formats) and should be prepared using the Times New Roman font (12 pt, justified), 24-point spacing. with 1 cm indent at the beginning of each paragraph.
        - paragraph [ref=e53]: Please, enumerate the paragraphs in order to make evident their hierarchical structure.
        - paragraph [ref=e54]:
          - text: "The title of the article should be in CAPITAL LETTERS; headings: 1. Small caps; subheadings: 1.1"
          - emphasis [ref=e55]: Italics
          - text: ; 1.2 Regular
        - paragraph [ref=e56]: For articles with more than one author, the authors should provide the order in which their names should appear in the header.
        - paragraph [ref=e57]: Bulleted items in a list should begin with an initial capital letter and be preceded by ‘– ’. Avoid using more than two levels in the lists.
        - paragraph [ref=e58]:
          - text: "The Em Dash (long dash) ‘–' should be used as a punctuation symbol (with a leading and trailing space). In all other cases, the En Dash (short dash) ‘-’ should be used, with no leading or trailing spaces. The multiplication sign should be the × symbol (ASCII code: Alt+158), not the letter ‘x’."
          - emphasis [ref=e59]: Et cetera
          - text: should be written ‘etc.’, preceded by a comma.
        - paragraph [ref=e60]:
          - text: In the article’s body, locutions in Latin or in a foreign language, should be written in italics only if they are not commonly used.
          - emphasis [ref=e61]: Ibid., supra, infra, et al.
          - text: should instead be always in italics. For articles written in languages other than English, commonly occurring English words (file, record, software...) should be written in regular font.
        - paragraph [ref=e62]: File format names should always be capitalized (e.g., PDF, CSV, ZIP etc.), names of programming languages should follow the standard form defined in relevant official documentation (e.g., Python, SQL, C++, etc.). Software names should be in regular font with capital initials (e.g., Microsoft Excel, Adobe Illustrator, Zotero, etc.). Web URLs should be written in full notation, including the protocol (e.g., https://zenodo.org/).
        - paragraph [ref=e63]: Text citations should be enclosed in French quotation marks (« »), followed by the bibliography reference and by the page number where the cited quote appears (e.g., Author year, 56). Double quotes “ ” are used to highlight a word.
        - paragraph [ref=e64]: "Bibliographic references in the text should follow the Harvard system of referencing: Author’s last name followed by the year of publication, all in round brackets; e.g., (Rossi 1994). When the number of authors is three or more, references in the text should be (Rossi et al. 1995). At the end of the paper, all references should be listed in alphabetical order and all authors should be included."
        - paragraph [ref=e65]: "Multiple quotes in parentheses (which should follow chronological order) should be separated by a semicolon (;). If the author is the same, the name should not be repeated (Author 2008, 2009). Where there are multiple citations for the same author and year, they should be written as follows: Author 1978a, 1978b."
        - paragraph [ref=e66]: Please avoid footnotes and integrate the text in the main structure of the paper.
        - paragraph [ref=e67]:
          - text: Use standard abbreviations for metric units (km, kg, m, etc.) without final full stops. Square metres should be expressed as m
          - superscript [ref=e68]: "2"
          - text: . Cardinal points should be indicated by capital letters without full stops (N, S, E, and O/W).
        - paragraph [ref=e69]:
          - strong [ref=e70]:
            - emphasis [ref=e71]: Images
        - paragraph [ref=e72]:
          - text: "All illustrations should have a progressive unique enumeration for each type: Fig. (pictures, drawings, graphs); Tab. (tables), and should have their own reference in the text. References to figures in the text are written in regular uppercase (Fig., Tab.); references to figures of cited volumes are in regular lowercase (fig., tav.)."
          - text: B/W and colour figures (max 10), with captions, should be sent separately from the text (.jpg or .tiff formats, 300 dpi). The online version will support colour figures; however, the same figures in the printed version could be in black and white. Please, verify that this will not compromise their quality.
          - text: "Text in captions should be preceded by the figure number followed by a long dash: Fig. 1 – ..."
          - text: Authors must obtain permission to publish illustrations taken from a copyrighted source. The figure caption should include the appropriate credit information.
        - paragraph [ref=e73]:
          - strong [ref=e74]:
            - emphasis [ref=e75]: References
        - paragraph [ref=e76]:
          - text: References to other publications should be in Harvard style. They should contain full bibliographical details. Journal titles should not be abbreviated. References should be presented at the end of the paper in alphabetical order. In the reference list all authors should be included.
          - text: Guidelines for bibliography references should be followed rigorously, otherwise the bibliography will be sent back to authors requesting necessary amendments.
          - text: The final bibliography, limited to references cited in the text, can include a dedicated section for web sources (webography).
          - text: English titles should be written with capital initials if they are monographs. In the case of journal articles or conference proceedings, initials should be lowercase.
          - text: Journal titles should be enclosed in French quotation marks « » and should be written in full (no abbreviations).
          - text: For volumes, the publisher should always be included after the publishing place.
          - text: For conference proceedings, curators’ names should always be included, followed by (eds.). The place and year of the conference should be written in italics between parentheses after its title.
        - paragraph [ref=e77]: For online publications, the DOI code, where available, or the relevant URL should be included at the end of the reference.
