    - generic [ref=e32]:
      - generic [ref=e33]:
        - paragraph [ref=e34]:
          - text: Journal established in 1990 by Mauro Cristofani and Riccardo Francovich
          - text: formerly directed by
          - link "Paola Moscati" [ref=e35] [cursor=pointer]:
            - /url: https://www.ispc.cnr.it/it_it/team/moscati-paola/
          - text: (1990-2022)
        - paragraph [ref=e36]:
          - text: "Editor in chief:"
          - link "Alessandra Caravale" [ref=e37] [cursor=pointer]:
            - /url: https://www.ispc.cnr.it/it_it/team/caravale-alessandra/
        - paragraph [ref=e38]:
          - text: Since 1990, Archeologia e Calcolatori (ISSN 1120-6861, e-ISSN 2385-1953) has been an international observatory of theoretical and methodological aspects of computing and information technology applied to archaeology. In 2007 the journal expanded to include a series of
          - link "Supplements" [ref=e39] [cursor=pointer]:
            - /url: /volumes/supplements
          - text: (ISSN 2385-202X, e-ISSN 2385-2038).
        - paragraph [ref=e40]:
          - text: Archeologia e Calcolatori is an ANVUR (Italian National Agency for the Evaluation of the Universities and Research Institutes)
          - link "A-rated Journal" [ref=e41] [cursor=pointer]:
            - /url: https://www.anvur.it/attivita/classificazione-delle-riviste/classificazione-delle-riviste-ai-fini-dellabilitazione-scientifica-nazionale/elenchi-di-riviste-scientifiche-e-di-classe-a/
          - text: in the scientific Areas 8 and 10. It is indexed in
          - link "Scopus" [ref=e42] [cursor=pointer]:
            - /url: https://www.scopus.com/sourceid/21100815385?origin=sbrowse#tabs=1
          - text: and in the Clarivate Analytics' Emerging Sources Citation Index. It is included in
          - link "ERIH PLUS" [ref=e43] [cursor=pointer]:
            - /url: https://kanalregister.hkdir.no/publiseringskanaler/erihplus/periodical/info.action?id=482808
          - text: and articles are stored in the CNR
          - link "SOLAR" [ref=e44] [cursor=pointer]:
            - /url: http://eprints.bice.rm.cnr.it/view/journal_volume/Archeologia_e_Calcolatori/
          - text: (Scientific Open-access Literature Archive and Repository) database of scientific publications.
        - paragraph [ref=e45]:
          - text: In 2005 Archeologia e Calcolatori joined the Open Archives Initiative, adopting the
          - link "OAI-PMH protocol" [ref=e46] [cursor=pointer]:
            - /url: https://www.archcalc.cnr.it/oai
          - text: . The journal is registered in the list of OAI Data Providers and OAIster contributors and in the Directory of Open Access Journals (
          - link "DOAJ" [ref=e47] [cursor=pointer]:
            - /url: https://doaj.org/search/journals?%23=%23.VlhvqL8jXG8&source=%7B%22query%22%3A%7B%22query_string%22%3A%7B%22query%22%3A%22Archeologia%20e%20Calcolatori%22%2C%22default_operator%22%3A%22AND%22%7D%7D%2C%22size%22%3A50%2C%22sort%22%3A%5B%7B%22created_date%22%3A%7B%22order%22%3A%22desc%22%7D%7D%5D%2C%22track_total_hits%22%3Atrue%7D#.VlhvqL8jXG8
          - text: ). Archeologia e Calcolatori is a data provider of the Open Access Infrastructure for Research in Europe (
          - link "OpenAIRE" [ref=e48] [cursor=pointer]:
            - /url: https://explore.openaire.eu/search/dataprovider?datasourceId=openaire____::f3a35cc23d629e74e8d5fe0d8bca1684
          - text: ). Moreover,
          - link "CulturaItalia" [ref=e49] [cursor=pointer]:
            - /url: http://www.culturaitalia.it/opencms/opencms/system/modules/com.culturaitalia_stage.liberologico/templates/ricerca.jsp?searchType=&imageField.x=0&imageField.y=0&language=it&q=archeologia+e+calcolatori&cat=indice
          - text: and
          - link "Europeana" [ref=e50] [cursor=pointer]:
            - /url: https://www.europeana.eu/it/search?query=archeologia+e+calcolatori&view=grid&page=1
          - text: expose over 900 resources from the journal's archive.
